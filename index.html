<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sunset Concert - 전화 예약</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- Reset & Base Styles --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #16213e 0%, #2e2a4f 15%, #7c628e 40%, #d5a6bd 70%, #f4c4c2 100%);
            font-family: 'Noto Sans KR', sans-serif;
            color: #ffffff;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.015);
            box-shadow: 0 10px 40px rgba(22, 33, 62, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: 40px;
        }

        /* --- Banner Section --- */
        .banner-wrap {
            width: 100%;
            position: relative;
        }
        
        .banner-wrap::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to top, rgba(46, 42, 79, 0.95), rgba(46, 42, 79, 0));
        }

        .banner-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* --- Content Section --- */
        .content-wrap {
            padding: 25px 25px 15px 25px;
            text-align: center;
        }

        .event-tag {
            display: inline-block;
            background: linear-gradient(90deg, #f7ce68, #fbab7e);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(251, 171, 126, 0.4);
        }

        .main-title {
            font-size: 28px;
            font-weight: 900;
            margin: 0 0 12px 0;
            background: linear-gradient(135deg, #FFF6E5 0%, #FFD090 50%, #FF9A76 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 3px 6px rgba(255, 154, 118, 0.3));
            letter-spacing: 0.5px;
        }

        .sub-title {
            font-size: 15px;
            color: #3d2d53;
            margin: 0;
            font-weight: 500;
        }

        /* 선착순 마감 임박 뱃지 */
        .urgency-wrap {
            margin-top: 16px;
        }

        .urgency-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, #e52d27 0%, #b31217 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            padding: 8px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(229, 45, 39, 0.4);
            letter-spacing: 0.5px;
            animation: pulseUrgency 2s infinite;
        }

        @keyframes pulseUrgency {
            0% { box-shadow: 0 0 0 0 rgba(229, 45, 39, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(229, 45, 39, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 45, 39, 0); }
        }

        /* --- Button Section --- */
        .button-wrap {
            padding: 0 20px;
            margin-top: 15px;
        }

        /* [추가됨] 고급스러운 골드 펄스 애니메이션 */
        @keyframes pulseGold {
            0% { box-shadow: 0 0 0 0 rgba(255, 208, 144, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 208, 144, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 208, 144, 0); }
        }

        .call-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e; 
            color: #FFD090; 
            text-decoration: none;
            font-size: 20px;
            font-weight: 800;
            padding: 22px 0;
            border-radius: 18px;
            border: 1px solid rgba(255, 208, 144, 0.3);
            /* 골드 펄스 애니메이션 적용 */
            animation: pulseGold 2s infinite;
            transition: all 0.3s ease;
        }

        .call-btn:active {
            transform: translateY(3px) scale(0.97);
            background: #0f0f1b;
            animation: none; /* 누를 때는 애니메이션 잠시 정지 */
            border-color: rgba(255, 208, 144, 0.1);
        }

        .phone-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            fill: #FFD090; 
        }

        /* [추가됨] 내선 번호 강력 안내 디자인 */
        .extension-info {
            margin-top: 16px;
            font-size: 15px;
            color: #3d2d53;
            text-align: center;
            font-weight: 700;
        }

        .extension-info .highlight {
            color: #d81b60; /* 시선을 끄는 진한 핑크/레드 포인트 */
            background-color: rgba(216, 27, 96, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 16px;
        }

        .info-desc {
            font-size: 13px;
            color: rgba(61, 45, 83, 0.7);
            margin-top: 8px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="banner-wrap">
            <img src="KakaoTalk_20260527_141843442_01.jpg" alt="Sunset Concert Promotion" class="banner-img">
        </div>

        <div class="content-wrap">
            <div class="event-tag">SPECIAL CONCERT</div>
            <h1 class="main-title">Sunset Concert</h1>
            <p class="sub-title">가장 아름다운 노을과 함께하는 음악의 향연<br>지금 바로 아래 버튼을 눌러 예약하세요.</p>
            
            <div class="urgency-wrap">
                <div class="urgency-badge">🔥 400명 선착순 마감 임박!</div>
            </div>
        </div>

        <div class="button-wrap">
            <a href="tel:031-488-8000" class="call-btn">
                <svg class="phone-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.6.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1zM19 12h2c0-4.8-3.9-8.7-8.7-8.7v2c3.7 0 6.7 3 6.7 6.7z"/>
                    <path d="M13 8.3c1.9 0 3.4 1.5 3.4 3.4h2c0-3-2.4-5.4-5.4-5.4v2z"/>
                </svg>
                콘서트 전화 예약하기
            </a>
            
            <div class="extension-info">
                📞 전화 연결 후 <span class="highlight">내선 5번</span>을 눌러주세요
            </div>
            
            <p class="info-desc">터치 한 번으로 빠르게 예약 상담을 받아보세요.</p>
        </div>
    </div>

</body>
</html>
